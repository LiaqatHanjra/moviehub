      <div class="relative z-10 w-full max-w-[430px] my-auto">
        <div
          class="relative rounded-2xl bg-surface-container-low/95 p-6 sm:p-9 shadow-2xl shadow-surface-container-lowest/90 backdrop-blur-2xl transition-all duration-300">
          <!-- Top Brand Header -->
          <div class="flex flex-col items-center text-center mb-7">
            <div class="flex items-center gap-2 mb-4 group cursor-pointer">
              <div
                class="w-10 h-10 rounded-xl overflow-hidden shadow-lg shadow-primary-container/30 flex items-center justify-center bg-surface-container">
                <a href="index.html">
                  <div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center shadow-[0_0_16px_rgba(49,152,220,0.35)] group-hover:scale-105 transition-transform">
            <span class="material-symbols-outlined text-white-container text-[22px]">play_arrow</span></div>
              </div>
              <span class="font-headline-md text-headline-md tracking-tight text-on-surface">
                Movie<span class="text-primary font-headline-xl-mobile sm:font-headline-xl">Hub</span>
              </span>
              </a>
            </div>
            <h1 class="font-headline-lg-mobile sm:font-headline-lg text-headline-lg-mobile sm:text-headline-lg text-on-surface mb-1.5 tracking-tight">
              Welcome Back
            </h1>
            <p class="font-body-md text-body-md text-on-surface-variant">
              Login to your account
            </p>
          </div>
          <!-- Login Form Formwork -->
          <form class="flex flex-col gap-4" id="loginForm" onsubmit="event.preventDefault(); return false;">
            <!-- Email / Mobile Input Field -->
            <div class="flex flex-col gap-1.5 text-left">
              <label class="font-label-md text-label-md text-on-surface-variant pl-0.5" for="emailInput">
                Email / Mobile
              </label>
              <div
                class="relative flex items-center rounded-xl bg-surface-container transition-all duration-200 focus-within:bg-surface-container-high focus-within:shadow-[0_0_0_2px_rgba(49,152,220,0.5)]">
                <div class="absolute left-3.5 flex items-center pointer-events-none text-outline">
                  <span class="material-symbols-outlined text-[19px]">mail</span>
                </div>
                <input autocomplete="username"
                  class="w-full h-11 pl-10 pr-3.5 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-sm focus:outline-none"
                  id="emailInput" placeholder="Enter your email or mobile number" required="" type="text" />
              </div>
            </div>
            <!-- Password Input Field -->
            <div class="flex flex-col gap-1.5 text-left">
              <label class="font-label-md text-label-md text-on-surface-variant pl-0.5" for="passwordInput">
                Password
              </label>
              <div
                class="relative flex items-center rounded-xl bg-surface-container transition-all duration-200 focus-within:bg-surface-container-high focus-within:shadow-[0_0_0_2px_rgba(49,152,220,0.5)]">
                <div class="absolute left-3.5 flex items-center pointer-events-none text-outline">
                  <span class="material-symbols-outlined text-[19px]">lock</span>
                </div>
                <input autocomplete="current-password"
                  class="w-full h-11 pl-10 pr-11 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant placeholder:font-body-sm focus:outline-none"
                  id="passwordInput" placeholder="Enter your password" required="" type="password" />
                <button aria-label="Toggle password visibility"
                  class="absolute right-3.5 flex items-center justify-center text-outline hover:text-on-surface transition-colors focus:outline-none"
                  id="togglePasswordBtn" type="button">
                  <span class="material-symbols-outlined text-[19px]" id="pwdEyeIcon">visibility</span>
                </button>
              </div>
            </div>
            <!-- Options: Remember Me & Forgot Password -->
            <div class="flex items-center justify-between pt-0.5 pb-1">
              <label class="flex items-center gap-2 cursor-pointer select-none group">
                <div class="relative flex items-center">
                  <input class="peer sr-only" id="rememberMe" type="checkbox" />
                  <div
                    class="w-4 h-4 rounded bg-surface-container peer-checked:bg-primary-container peer-focus-visible:ring-2 peer-focus-visible:ring-primary transition-all flex items-center justify-center">
                    <span
                      class="material-symbols-outlined text-white-container text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity font-bold">check</span>
                  </div>
                </div>
                <span
                  class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
                  Remember Me
                </span>
              </label>
              <a class="font-label-md text-label-md text-primary hover:text-secondary-fixed transition-colors underline-offset-4 hover:underline"
                href="#">
                Forgot Password?
              </a>
            </div>
            <!-- Primary Action Button -->
            <button
              class="relative overflow-hidden w-full h-12 mt-1 rounded-xl bg-primary-container text-white font-headline-sm text-headline-sm flex items-center justify-center gap-2 transition-all duration-300 shadow-[0_8px_20px_-4px_rgba(49,152,220,0.45)] hover:shadow-[0_12px_24px_-2px_rgba(49,152,220,0.6)] hover:brightness-110 active:scale-[0.98]"
              id="loginSubmitBtn" type="submit">

              <a class="font-headline-sm text-headline-sm text-white" id="btnText" href="landingpage.html">
                Login
              </a>
              <span class="hidden material-symbols-outlined text-[20px] animate-spin"
                id="btnSpinner">progress_activity</span>
            </button>
          </form>
          <!-- Switch to Register Link -->
          <div class="text-center mt-7 pt-4">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
              Don't have an account?
              <a class="font-label-lg text-label-lg text-primary hover:text-secondary-fixed transition-colors ml-1 font-semibold underline-offset-4 hover:underline"
                href="register.html">
                Register
              </a>
            </p>
          </div>
        </div>
        <!-- Quick Footer Badges / Trust Markers -->
        <div class="flex items-center justify-center gap-6 mt-6 text-outline font-label-sm text-label-sm">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px] text-tertiary">verified_user</span>
            <span>Secure Stream TVOD</span>
          </div>
          <div class="w-1 h-1 rounded-full bg-surface-variant"></div>
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px] text-primary">hd</span>
            <span>Ultra 4K Atmos</span>
          </div>
          <div class="w-1 h-1 rounded-full bg-surface-variant"></div>
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-[16px]">bolt</span>
            <span>Instant Access</span>
          </div>
        </div>
      </div>
      <script>
        (function initLoginInteractions() {
          const toggleBtn = document.getElementById('togglePasswordBtn');
          const pwdInput = document.getElementById('passwordInput');
          const eyeIcon = document.getElementById('pwdEyeIcon');
          const form = document.getElementById('loginForm');
          const submitBtn = document.getElementById('loginSubmitBtn');
          const btnText = document.getElementById('btnText');
          const btnSpinner = document.getElementById('btnSpinner');

          if (toggleBtn && pwdInput && eyeIcon) {
            toggleBtn.addEventListener('click', () => {
              const isPassword = pwdInput.type === 'password';
              pwdInput.type = isPassword ? 'text' : 'password';
              eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
            });
          }

          if (form && submitBtn) {
            form.addEventListener('submit', (e) => {
              e.preventDefault();
              if (btnText && btnSpinner) {
                btnText.textContent = 'Verifying...';
                btnSpinner.classList.remove('hidden');
                submitBtn.setAttribute('disabled', 'true');

                setTimeout(() => {
                  btnText.textContent = 'Redirecting...';
                  setTimeout(() => {
                    btnText.textContent = 'Login';
                    btnSpinner.classList.add('hidden');
                    submitBtn.removeAttribute('disabled');
                  }, 1000);
                }, 1200);
              }
            });
          }
        })();
      </script>
