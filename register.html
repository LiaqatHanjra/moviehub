<!-- Registration Form -->
<form class="w-full flex flex-col gap-4" id="registerForm" onsubmit="event.preventDefault();">
<!-- Field: Full Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1" for="fullName">
          Full Name
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            person
          </span>
<input class="w-full h-11 pl-11 pr-4 bg-surface-container rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-variant transition-all shadow-inner" id="fullName" placeholder="Enter your name" required="" type="text"/>
</div>
</div>
<!-- Field: Email / Mobile -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center gap-1" for="identifier">
          Email / Mobile Number
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            mail
          </span>
<input class="w-full h-11 pl-11 pr-4 bg-surface-container rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-variant transition-all shadow-inner" id="identifier" placeholder="Enter your email or mobile number" required="" type="text"/>
</div>
</div>
<!-- Field: Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant flex items-center justify-between" for="password">
<span>Password</span>
<span class="text-tertiary font-label-sm text-label-sm lowercase opacity-90">min. 8 chars</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            lock
          </span>
<input class="w-full h-11 pl-11 pr-11 bg-surface-container rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-variant transition-all shadow-inner" id="password" placeholder="Create a password" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center" id="togglePassBtn" onclick="const p = document.getElementById('password'); const icon = document.getElementById('passIcon'); if(p.type === 'password'){ p.type = 'text'; icon.textContent = 'visibility'; } else { p.type = 'password'; icon.textContent = 'visibility_off'; }" type="button">
<span class="material-symbols-outlined text-[18px]" id="passIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Field: Confirm Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant" for="confirmPassword">
          Confirm Password
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            verified_user
          </span>
<input class="w-full h-11 pl-11 pr-11 bg-surface-container rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-variant transition-all shadow-inner" id="confirmPassword" placeholder="Confirm your password" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center" id="toggleConfirmPassBtn" onclick="const p = document.getElementById('confirmPassword'); const icon = document.getElementById('confirmPassIcon'); if(p.type === 'password'){ p.type = 'text'; icon.textContent = 'visibility'; } else { p.type = 'password'; icon.textContent = 'visibility_off'; }" type="button">
<span class="material-symbols-outlined text-[18px]" id="confirmPassIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Terms & Conditions Consent -->
<label class="flex items-start gap-2.5 mt-1 cursor-pointer select-none group">
<input checked="" class="mt-1 h-4 w-4 rounded bg-surface-container text-primary-container focus:ring-0 focus:outline-none accent-primary-container cursor-pointer" id="termsCheckbox" required="" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors leading-snug">
          I agree to the <a class="text-primary hover:underline" href="index.html#legal">Terms of Service</a>, <a class="text-primary hover:underline" href="index.html#legal">Content Licensing Policy</a> and <a class="text-primary hover:underline" href="index.html#legal">Privacy Statement</a>.
        </span>
</label>
<!-- Primary Action CTA -->
<button class="mt-3 w-full h-12 rounded-full bg-gradient-to-r from-primary-container via-primary-container to-secondary-container text-white font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-lg shadow-primary-container/25 hover:shadow-primary-container/40 active:scale-[0.99] transition-all duration-200" id="submitBtn" type="submit">

</button>

</svg>
<span>Google</span>

<svg class="w-4 h-4 fill-current text-on-surface" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 1.01-2.87-.96.04-2.16.65-2.84 1.44-.54.62-1.01 1.68-.88 2.71 1.07.08 2.1-.53 2.71-1.28z"></path>

</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1.5 font-label-sm text-label-sm uppercase tracking-wider">

<!-- Interactive script to handle submission microinteraction feedback -->
<script>
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function() {
      const originalHTML = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Creating Profile...</span>
      `;
      
      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
          <span>Account Created!</span>
        `;
        submitBtn.classList.remove('from-primary-container', 'to-secondary-container');
        submitBtn.classList.add('bg-tertiary-container', 'text-on-tertiary');
      }, 1200);
    });
  </script>
